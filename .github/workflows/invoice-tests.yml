name: Invoice flow regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  invoice-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, simplexml, mbstring, pcntl
          coverage: none
      - name: Exercise invoice services with isolated Stripe and Moodle adapters
        run: php tests/standalone/run.php
